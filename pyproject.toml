[project]
name = "orbital-ember-api"
version = "0.1.0"
description = "Backend for the NASA Space Apps microgravity fire-safety intelligence dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]
desktop = [
  "pywebview>=5.4,<6.0",
  "PySide6>=6.7,<7.0",
  "qtpy>=2.4,<3.0",
]
build = [
  "pyinstaller>=6.10,<7.0",
  "playwright>=1.48,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
include-package-data = true

[tool.setuptools.package-data]
app = ["static/*", "bundled_data/psi/*", "bundled_data/psi/files/**/*"]
